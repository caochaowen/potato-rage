<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>potato_roge · 代码架构可视化</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --surface-2: #f3f2ef;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --surface-2: #222220;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --surface-2: #222220;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    font-size: 14px;
    overflow: hidden;
  }

  /* ---------- 分类配色（来自校验过的数据可视化色板） ---------- */
  .cat-core      { --c: #2a78d6; --cd: #3987e5; }
  .cat-player    { --c: #eb6834; --cd: #d95926; }
  .cat-enemy     { --c: #1baf7a; --cd: #199e70; }
  .cat-component { --c: #eda100; --cd: #c98500; }
  .cat-ui        { --c: #e87ba4; --cd: #d55181; }
  .cat-scene     { --c: #008300; --cd: #008300; }
  :root[data-theme="dark"] .cat-core      { --c: #3987e5; }
  :root[data-theme="dark"] .cat-player    { --c: #d95926; }
  :root[data-theme="dark"] .cat-enemy     { --c: #199e70; }
  :root[data-theme="dark"] .cat-component { --c: #c98500; }
  :root[data-theme="dark"] .cat-ui        { --c: #d55181; }
  :root[data-theme="dark"] .cat-scene     { --c: #008300; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .cat-core      { --c: #3987e5; }
    :root:where(:not([data-theme="light"])) .cat-player    { --c: #d95926; }
    :root:where(:not([data-theme="light"])) .cat-enemy     { --c: #199e70; }
    :root:where(:not([data-theme="light"])) .cat-component { --c: #c98500; }
    :root:where(:not([data-theme="light"])) .cat-ui        { --c: #d55181; }
    :root:where(:not([data-theme="light"])) .cat-scene     { --c: #008300; }
  }

  /* ---------- 布局 ---------- */
  .app { display: grid; grid-template-columns: 280px 1fr 440px; height: 100vh; }

  /* ---------- 顶部栏 ---------- */
  .topbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    height: 56px;
  }
  .topbar .title { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  .topbar .title .accent { color: var(--accent); }
  .topbar .subtitle { color: var(--text-secondary); font-size: 12.5px; }
  .topbar .spacer { flex: 1; }
  .topbar .meta { color: var(--text-muted); font-size: 12px; }
  .theme-btn {
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text-primary); padding: 6px 12px; border-radius: 8px;
    cursor: pointer; font-size: 12.5px;
  }
  .theme-btn:hover { border-color: var(--accent); }

  /* ---------- 侧边栏 ---------- */
  .sidebar {
    background: var(--surface-1);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px;
    grid-row: 2;
  }
  .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin: 14px 0 6px; }
  .sidebar .group:first-child h2 { margin-top: 2px; }
  .mod-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 9px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; margin-bottom: 2px;
  }
  .mod-item:hover { background: var(--surface-2); }
  .mod-item.active { background: var(--surface-2); border-color: var(--border); }
  .mod-item .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c); }
  .mod-item .name { font-weight: 600; }
  .mod-item .file { margin-left: auto; color: var(--text-muted); font-size: 11px; font-family: ui-monospace, monospace; }

  /* ---------- 图区 ---------- */
  .graph-panel { grid-row: 2; display: flex; flex-direction: column; background: var(--page); min-width: 0; }
  .graph-header {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 10px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border);
  }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .legend .swatch { width: 11px; height: 11px; border-radius: 3px; background: var(--c); }
  .edge-legend { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-muted); }
  .edge-legend .line { width: 22px; height: 0; border-top: 2px solid; }
  .edge-legend .line.extends { border-color: var(--accent); }
  .edge-legend .line.ref { border-color: var(--text-muted); border-top-width: 1px; }
  .edge-legend .line.signal { border-color: var(--text-secondary); border-top-style: dashed; }
  #graph { flex: 1; width: 100%; cursor: grab; }
  #graph:active { cursor: grabbing; }
  .graph-tip { padding: 8px 16px; color: var(--text-muted); font-size: 11.5px; border-top: 1px solid var(--border); background: var(--surface-1); }

  .node rect { stroke-width: 2; }
  .node text.name { font-weight: 600; fill: var(--text-primary); }
  .node text.kind { fill: var(--c); font-size: 10px; }
  .node .ring { fill: none; stroke: var(--c); }
  .node.dim { opacity: 0.18; }
  .node.selected .ring { stroke-width: 3; }

  .edge { stroke: var(--text-muted); stroke-opacity: 0.55; }
  .edge.extends { stroke: var(--accent); stroke-width: 2.4; stroke-opacity: 0.9; }
  .edge.ref { stroke-width: 1.2; }
  .edge.signal { stroke: var(--text-secondary); stroke-dasharray: 5 4; stroke-width: 1.4; }
  .edge.dim { opacity: 0.08; }
  .edge.hl { opacity: 1; stroke-opacity: 1; }
  .edge-label { font-size: 9.5px; fill: var(--text-muted); pointer-events: none; }

  /* ---------- 详情面板 ---------- */
  .detail { grid-row: 2; background: var(--surface-1); border-left: 1px solid var(--border); overflow-y: auto; }
  .detail .empty { padding: 40px 20px; color: var(--text-muted); text-align: center; font-size: 13px; }
  .detail-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
  .detail-head .badge { display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--c); border: 1px solid var(--c); border-radius: 20px; padding: 2px 9px; margin-bottom: 8px; }
  .detail-head h1 { margin: 0; font-size: 20px; }
  .detail-head .classline { color: var(--text-secondary); font-family: ui-monospace, monospace; font-size: 12px; margin-top: 4px; }
  .detail-head .path { color: var(--text-muted); font-size: 11px; font-family: ui-monospace, monospace; margin-top: 3px; word-break: break-all; }
  .detail section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .detail section h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
  .summary { line-height: 1.7; color: var(--text-secondary); }
  .summary strong { color: var(--text-primary); }

  .method-chip {
    display: block; width: 100%; text-align: left;
    border: 1px solid var(--border); background: var(--surface-2);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
    font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-primary);
  }
  .method-chip:hover { border-color: var(--accent); }
  .method-chip.active { border-color: var(--accent); }
  .method-chip .mn { font-weight: 700; }
  .method-chip .ret { color: var(--c); }

  .method-card {
    border-left: 3px solid var(--accent); background: var(--surface-2);
    border-radius: 0 8px 8px 0; padding: 10px 12px; margin: 4px 0 12px;
  }
  .method-card .sig { font-family: ui-monospace, monospace; font-size: 12.5px; font-weight: 600; }
  .method-card .desc { color: var(--text-secondary); line-height: 1.7; margin-top: 6px; font-size: 13px; }
  .method-card .params { margin-top: 8px; }
  .method-card .param { font-size: 12px; color: var(--text-secondary); margin: 3px 0; }
  .method-card .param code { font-family: ui-monospace, monospace; color: var(--accent); }

  .codebox { padding: 0; border-bottom: none; }
  .codebox pre { margin: 0; }
  .codeline { display: flex; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11.8px; line-height: 1.55; }
  .codeline .ln { flex: none; width: 34px; text-align: right; padding-right: 12px; color: var(--text-muted); user-select: none; border-right: 1px solid var(--border); margin-right: 12px; opacity: .7; }
  .codeline .ct { white-space: pre; }
  .codeline.hl { background: rgba(42,120,214,0.12); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .codeline.hl .ln { color: var(--c); font-weight: 700; opacity: 1; }

  /* 语法高亮 */
  .kw { color: #cf4bb1; font-weight: 600; }
  .st { color: #2f9e44; }
  .cm { color: var(--text-muted); font-style: italic; }
  .num { color: #e8590c; }
  .nd { color: var(--accent); font-weight: 600; }
  .ann { color: #d55181; }
  .type { color: #0ca3a3; }
  :root[data-theme="dark"] .kw { color: #e08be6; }
  :root[data-theme="dark"] .st { color: #7fd88f; }
  :root[data-theme="dark"] .num { color: #ffa94d; }
  :root[data-theme="dark"] .type { color: #63e6be; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="title">🥔 <span class="accent">potato_roge</span> 代码架构可视化</span>
    <span class="subtitle">模块关系 · 方法浏览 · 源码与注释</span>
    <span class="spacer"></span>
    <span class="meta">13 个脚本模块 · 点击节点/列表项查看详情</span>
    <button class="theme-btn" id="themeBtn">🌓 深浅切换</button>
  </header>

  <aside class="sidebar" id="sidebar"></aside>

  <main class="graph-panel">
    <div class="graph-header" id="legendBar"></div>
    <svg id="graph"></svg>
    <div class="graph-tip">拖拽节点调整布局 · 单击节点或左侧列表查看该模块的方法与源码 · 悬停高亮关联关系</div>
  </main>

  <aside class="detail" id="detail"><div class="empty">← 点击左侧模块或图中节点<br>查看模块功能、方法与源码注释</div></aside>
</div>

<script>
"use strict";

/* ================= 分类元数据 ================= */
const CATS = {
  core:      { label: '核心 / 基础', c: '#2a78d6', cd: '#3987e5' },
  player:    { label: '玩家',        c: '#eb6834', cd: '#d95926' },
  enemy:     { label: '敌人',        c: '#1baf7a', cd: '#199e70' },
  component: { label: '组件',        c: '#eda100', cd: '#c98500' },
  ui:        { label: 'UI',          c: '#e87ba4', cd: '#d55181' },
  scene:     { label: '全局 / 场景', c: '#008300', cd: '#008300' },
};

/* ================= 模块数据 ================= */
const MODULES = [
{
  id: 'unit', name: 'Unit', class_name: 'Unit', file: 'scripts/unit.gd', category: 'core', base: 'Node2D',
  summary: '所有战斗单位的<strong>基类</strong>（玩家与敌人的共同祖先）。它不实现移动逻辑，而是封装单位共有的构成与行为：绑定视觉节点（<code>Visuals</code>/<code>Sprite</code>）、血量组件（<code>HealthComponent</code>）、受击闪白（FlashTimer）与格挡判定。子类只需覆盖移动/朝向逻辑即可复用全部受击与死亡处理。',
  methods: [
    { name: '_ready', sig: '_ready() -> void', desc: '场景就绪回调：把 <code>stats</code> 传给血量组件 <code>setup()</code>，完成生命值上限与当前值的初始化。', params: [] },
    { name: 'set_flash_material', sig: 'set_flash_material() -> void', desc: '受击「闪白」效果：给精灵挂上全局闪光材质（<code>Global.FLASH_MATERIAL</code>）并启动 FlashTimer，短暂高亮后由定时器回调恢复。', params: [] },
    { name: '_on_hurtbox_component_on_damaged', sig: '_on_hurtbox_component_on_damaged(hitbox: HitboxComponent) -> void', desc: '受击统一入口（由 <code>HurtboxComponent.on_damaged</code> 信号触发）。流程：①血量已归零则直接返回；②按 <code>block_chance/100</code> 做<strong>格挡判定</strong>，成功则发格挡飘字并返回；③否则闪白、<code>take_damage</code> 扣血、发伤害飘字。', params: [ { n: 'hitbox', t: 'HitboxComponent', d: '命中本单位的攻击盒，携带伤害/暴击等信息' } ] },
    { name: '_on_flash_timer_timeout', sig: '_on_flash_timer_timeout() -> void', desc: '闪白定时器结束：把精灵材质置 <code>null</code> 恢复原始外观。', params: [] },
  ],
  code: `extends Node2D
class_name Unit

@export var stats:UnitStats

@onready var visuals: Node2D = %Visuals
@onready var sprite: Sprite2D = %Sprite
@onready var animation_player: AnimationPlayer = $AnimationPlayer
@onready var health_component: HealrhComponent = $HealthComponent
@onready var flash_timer: Timer = $FlashTimer


func _ready() -> void:
	health_component.setup(stats)

func set_flash_material() -> void:
	sprite.material = Global.FLASH_MATERIAL
	flash_timer.start()

func _on_hurtbox_component_on_damaged(hitbox: HitboxComponent) -> void:
	if health_component.current_health <= 0:
		return

	var blocked := Global.get_chance_sucesss(stats.block_chance/100)
	if blocked:
		Global.on_create_block_text.emit(self)
		return
	set_flash_material()

	health_component.take_damage(hitbox.damage)
	Global.on_create_damage_text.emit(self, hitbox)


func _on_flash_timer_timeout() -> void:
	sprite.material = null`
},

{
  id: 'player', name: 'Player', class_name: 'Player', file: 'scripts/player.gd', category: 'player', base: 'Unit',
  summary: '<strong>玩家控制</strong>逻辑，继承 <code>Unit</code>。处理 WASD 八方向移动、<strong>冲刺（dash）</strong>机制、跑/待机动画切换、朝向翻转，并把玩家位置钳制在竞技场范围内。冲刺时半透明、禁用碰撞并触发残影（Trail）。',
  methods: [
    { name: '_ready', sig: '_ready() -> void', desc: '调用父类 <code>_ready()</code> 完成血量初始化，并把冲刺时长与冷却时间写入对应计时器。', params: [] },
    { name: '_process', sig: '_process(delta: float) -> void', desc: '每帧主循环：读取输入方向 → 计算速度（冲刺时乘 <code>dash_speed_multi</code>）→ 位移 → 边界钳制（x∈[-950,950]、y∈[-500,500]）→ 尝试冲刺 → 更新动画与朝向。', params: [ { n: 'delta', t: 'float', d: '距上一帧的时间（秒）' } ] },
    { name: 'update_animations', sig: 'update_animations() -> void', desc: '有移动方向则播放 <code>run</code> 动画，否则播放 <code>idle</code>。', params: [] },
    { name: 'update_rotation', sig: 'update_rotation() -> void', desc: '朝向翻转：根据水平移动方向把 <code>Visuals</code> 缩放到 (∓0.5, 0.5) 实现左右镜像；无输入则保持。', params: [] },
    { name: 'start_dash', sig: 'start_dash() -> void', desc: '进入冲刺：置 <code>is_dash</code>、启动冲刺计时器、开始残影、精灵半透明、用 <code>set_deferred</code> 暂禁碰撞体（避免物理引擎安全期冲突）。', params: [] },
    { name: 'can_dash', sig: 'can_dash() -> bool', desc: '冲刺条件：非冲刺中 且 冷却计时器已停 且 刚按下 <code>dash</code> 键 且 有移动方向。', params: [] },
    { name: '_on_dash_timer_timeout', sig: '_on_dash_timer_timeout() -> void', desc: '冲刺结束：恢复状态/透明度/碰撞，并把移动方向清零，随后启动冷却计时器。', params: [] },
  ],
  code: `extends Unit
class_name Player

@export var dash_duration := 0.5
@export var dash_speed_multi := 0.5
@export var dash_cooldown := 0.5

@onready var dash_timer: Timer = $DashTimer
@onready var dash_cooldown_timer: Timer = $DashCooldownTimer
@onready var collision: CollisionShape2D = $CollisionShape2D
@onready var trail: Trail = %Trail


var move_dir:Vector2
var is_dash := false
var dash_available := true

func _ready() -> void:
	super._ready()
	dash_timer.wait_time = dash_duration
	dash_cooldown_timer.wait_time = dash_cooldown

func _process(delta: float) -> void:
	move_dir = Input.get_vector("move_left","move_right","move_up","move_down")

	var current_velocity := move_dir * stats.speed
	if is_dash:
		current_velocity *= dash_speed_multi
	position += current_velocity * delta
	position.x = clamp(position.x,-950,950)
	position.y = clamp(position.y,-500,500)
	if can_dash():
		start_dash()
	update_animations()
	update_rotation()

func update_animations() -> void:
	if move_dir.length() > 0:
		animation_player.play("run")
	else:
		animation_player.play("idle")

func update_rotation() -> void:
	if move_dir == Vector2.ZERO:
		return

	if move_dir.x >= 0.1:
		visuals.scale = Vector2(-0.5,0.5)
	else:
		visuals.scale = Vector2(0.5,0.5)


func start_dash() -> void:
	is_dash = true
	dash_timer.start()
	trail.start_trail()
	visuals.modulate.a = 0.5
	collision.set_deferred("disabled",true)

func can_dash() -> bool:
	return not is_dash and dash_cooldown_timer.is_stopped() and Input.is_action_just_pressed("dash") and move_dir != Vector2.ZERO




func _on_dash_timer_timeout() -> void:
	is_dash = false
	visuals.modulate.a = 1.0
	move_dir = Vector2.ZERO
	collision.set_deferred("disabled",false)
	dash_cooldown_timer.start()`
},

{
  id: 'enemy', name: 'Enemy', class_name: 'Enemy', file: 'scripts/enemy.gd', category: 'enemy', base: 'Unit',
  summary: '<strong>敌人 AI</strong>，继承 <code>Unit</code>。实现朝玩家追踪移动、<strong>群体分离（flock）</strong>避免同类堆叠、与玩家保持一定距离（>60 不贴脸），并根据相对位置翻转朝向。所有敌方变体（chaser/charger/shooter）共用此脚本。',
  methods: [
    { name: '_process', sig: '_process(delta: float) -> void', desc: '每帧：若不可移动或不能朝玩家移动则提前返回；否则按 <code>get_move_direction()</code> 的方向以 <code>stats.speed</code> 位移。', params: [ { n: 'delta', t: 'float', d: '距上一帧的时间（秒）' } ] },
    { name: 'get_move_direction', sig: 'get_move_direction() -> Vector2', desc: '计算移动方向：基础方向为朝玩家；再遍历视野区（<code>VisionArea</code>）内重叠的同类，叠加 <code>flock_push</code> 分离力，使敌人彼此推开、不重叠。玩家无效时返回零向量。', params: [] },
    { name: 'update_rotation', sig: 'update_rotation() -> void', desc: '朝向翻转：以「自身 x 是否小于玩家 x」判断向右还是向左，缩放 <code>Visuals</code> 实现镜像。', params: [] },
    { name: 'can_move_towards_player', sig: 'can_move_towards_player() -> bool', desc: '判定玩家实例是否有效，且与玩家距离 > 60（避免挤进玩家体内）。', params: [] },
  ],
  code: `extends Unit
class_name Enemy

@export var flock_push :=20.0
@onready var vision_area: Area2D = $VisionArea

var can_move := true

func _process(delta: float) -> void:
	if not can_move:
		return

	if not can_move_towards_player():
		return

	position += get_move_direction() * stats.speed * delta
	update_rotation

func get_move_direction() -> Vector2:
	if not is_instance_valid(Global.player):
		return Vector2.ZERO

	var direction := global_position.direction_to(Global.player.global_position)
	for area: Node2D in vision_area.get_overlapping_areas():
		if area!=self and area.is_inside_tree():
			var vector := global_position - area.global_position
			direction += flock_push * vector.normalized() / vector.length()

	return direction


func update_rotation() -> void:
	if not is_instance_valid(Global.player):
		return

	var player_pos := Global.player.global_position
	var moving_right := global_position.x <player_pos.x
	visuals.scale = Vector2(-0.5, 0.5) if moving_right else Vector2(0.5,0.5)

func can_move_towards_player() -> bool:
	return is_instance_valid(Global.player) and global_position.distance_to(Global.player.global_position) > 60`
},

    { name: 'take_damage', sig: 'take_damage(value: float) -> void', desc: '扣血：已归零则忽略；扣血后用 <code>max()</code> 保证不低于 0；广播受击与血量变化；归零时广播死亡并调用 <code>die()</code>。', params: [ { n: 'value', t: 'float', d: '伤害数值' } ] },
    { name: 'heal', sig: 'heal(amount: float) -> void', desc: '治疗：仅存活时生效；加血后用 <code>min()</code> 钳制到上限；广播血量变化。', params: [ { n: 'amount', t: 'float', d: '治疗量' } ] },

  ],
  code: `extends Node
class_name HealrhComponent

signal on_unit_hit
signal on_unit_died
signal on_health_changed(current:float,max:float)

var max_health := 1.0
var current_health := 1.0

func setup(stats:UnitStats) -> void:
	max_health = stats.health
	current_health = max_health
	on_health_changed.emit(current_health,max_health)

func take_damage(value: float) -> void:
	if current_health<=0:
		return

	current_health -= value
	current_health = max(current_health,0)

	on_unit_hit.emit()
	on_health_changed.emit(current_health,max_health)

	if current_health <= 0:
		current_health=0
		on_unit_died.emit()
		die()

func heal(amount: float) -> void:
	if current_health <= 0:
		return

	current_health += amount
	current_health = min(current_health,max_health)
	on_health_changed.emit(current_health,max_health)

func die() -> void:
	owner.queue_free()`

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  const groups = {};
  MODULES.forEach(m => { (groups[m.category] ||= []).push(m); });
  const order = ['core','player','enemy','component','ui','scene'];
  sb.innerHTML = order.map(cat => {
    const list = groups[cat];
    if (!list) return '';
    const items = list.map(m => `
      <div class="mod-item cat-${m.category}" data-id="${m.id}">
        <span class="dot"></span>
        <span class="name">${m.name}</span>
        <span class="file">${m.file.split('/').pop()}</span>
      </div>`).join('');
    return `<div class="group"><h2>${CATS[cat].label}</h2>${items}</div>`;
  }).join('');
}

  const cats = Object.entries(CATS).map(([k, c]) =>
    `<span class="legend cat-${k}"><span class="swatch"></span>${c.label}</span>`).join('');
  bar.innerHTML = `
    <span style="font-size:12px;color:var(--text-muted);font-weight:600;margin-right:4px;">模块分类</span>
    ${cats}
    <span style="width:1px;height:16px;background:var(--border);margin:0 4px;"></span>
    <span class="edge-legend"><span class="line extends"></span>继承</span>
    <span class="edge-legend"><span class="line ref"></span>引用</span>
    <span class="edge-legend"><span class="line signal"></span>信号</span>`;
}

/* ================= 语法高亮 ================= */
const KEYWORDS = new Set(['extends','class_name','func','var','const','if','else','elif','return','for','in','while','await','signal','enum','pass','true','false','null','self','super','not','and','or','is','void','static','match','break','continue']);
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function highlight(code){
  let out = '', i = 0, n = code.length;
  while (i < n) {
    const c = code[i];
    if (c === '#') {                      // 注释
      let j = i; while (j < n && code[j] !== '\n') j++;
      out += '<span class="cm">' + esc(code.slice(i,j)) + '</span>'; i = j;
    } else if (c === '"') {               // 字符串
      let j = i + 1; while (j < n && code[j] !== '"' && code[j] !== '\n') j++;
      j = Math.min(j + 1, n);
      out += '<span class="st">' + esc(code.slice(i,j)) + '</span>'; i = j;
    } else if (c === '$' || c === '%') {  // 节点引用
      let j = i + 1; while (j < n && /[A-Za-z0-9_/]/.test(code[j])) j++;
      out += '<span class="nd">' + esc(code.slice(i,j)) + '</span>'; i = j;
    } else if (c === '@') {               // @export / @onready
      let j = i + 1; while (j < n && /[A-Za-z_]/.test(code[j])) j++;
      out += '<span class="ann">' + esc(code.slice(i,j)) + '</span>'; i = j;
    } else if (/[A-Za-z_]/.test(c)) {     // 标识符 / 关键字 / 类型
      let j = i; while (j < n && /[A-Za-z0-9_]/.test(code[j])) j++;
      const w = code.slice(i, j);
      if (KEYWORDS.has(w)) out += '<span class="kw">' + esc(w) + '</span>';
      else if (/^[A-Z]/.test(w)) out += '<span class="type">' + esc(w) + '</span>';
      else out += esc(w);
      i = j;
    } else if (/[0-9]/.test(c)) {         // 数字
      let j = i; while (j < n && /[0-9.]/.test(code[j])) j++;
      out += '<span class="num">' + esc(code.slice(i,j)) + '</span>'; i = j;
    } else {
      out += esc(c); i++;
    }
  }
  return out;
}

/* ================= 详情面板 ================= */
let selectedModuleId = null;
let selectedMethod = null;

function methodLineRange(code, name) {
  const lines = code.split('\n');
  const start = lines.findIndex(l => l.includes('func ' + name + '(') || l.includes('func ' + name + ' '));
  if (start < 0) return null;
  let end = lines.length - 1;
  for (let i = start + 1; i < lines.length; i++) {
    if (/^func\s/.test(lines[i])) { end = i - 1; break; }
  }
  return { start, end };
}

function renderDetail(m) {
  const el = document.getElementById('detail');
  el.className = 'detail cat-' + m.category;   // 让 --c 级联到代码高亮
  const cat = CATS[m.category];
  const baseLine = m.base ? `<div class="classline">extends <b>${esc(m.base)}</b>${m.class_name ? ' · class_name <b>' + esc(m.class_name) + '</b>' : ''}</div>` : '';
  const methodChips = m.methods.length
    ? m.methods.map(mt => {
        const isSel = selectedMethod === mt.name;
        return `<button class="method-chip ${isSel ? 'active' : ''}" data-m="${mt.name}"><span class="mn">${esc(mt.name)}</span><span class="ret">${esc(mt.sig.slice(mt.name.length))}</span></button>`;
      }).join('')
    : '<div style="color:var(--text-muted);font-size:12.5px;">（无方法，纯数据资源）</div>';

  const lines = m.code.split('\n');
  const range = selectedMethod ? methodLineRange(m.code, selectedMethod) : null;
  const codeHtml = lines.map((ln, idx) => {
    const hl = range && idx >= range.start && idx <= range.end ? ' hl' : '';
    return `<div class="codeline${hl}" data-line="${idx}"><span class="ln">${idx+1}</span><span class="ct">${highlight(ln) || ' '}</span></div>`;
  }).join('');

  const activeMethod = m.methods.find(mt => mt.name === selectedMethod);
  const methodCard = activeMethod ? `
    <div class="method-card">
      <div class="sig">${esc(activeMethod.sig)}</div>
      <div class="desc">${activeMethod.desc}</div>
      ${activeMethod.params && activeMethod.params.length ? '<div class="params">' + activeMethod.params.map(p =>
        `<div class="param"><code>${esc(p.n)}</code> : ${esc(p.t)} — ${p.d}</div>`).join('') + '</div>' : ''}
    </div>` : '';

  el.innerHTML = `
    <div class="detail-head cat-${m.category}">
      <span class="badge">${esc(cat.label)}</span>
      <h1>${esc(m.name)}</h1>
      ${baseLine}
      <div class="path">${esc(m.file)}</div>
    </div>
    <section><h3>模块功能</h3><div class="summary">${m.summary}</div></section>
    <section><h3>方法（${m.methods.length}）</h3>${methodChips}</section>
    <section class="codebox"><h3 style="padding-left:18px;margin-top:14px;">源码</h3>${methodCard}<pre>${codeHtml}</pre></section>`;

  el.querySelectorAll('.method-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      selectedMethod = chip.dataset.m;
      renderDetail(m);
      // 滚动到对应方法
      const r = methodLineRange(m.code, selectedMethod);
      if (r) {
        const lineEl = el.querySelector(`.codeline[data-line="${r.start}"]`);
        if (lineEl) lineEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });
}

function selectModule(id) {
  selectedModuleId = id;
  selectedMethod = null;
  const m = byId[id];
  renderDetail(m);
  document.querySelectorAll('.mod-item').forEach(i => i.classList.toggle('active', i.dataset.id === id));
  updateGraphSelection();
}

/* ================= 力导向图 ================= */
const svg = document.getElementById('graph');
const nodes = MODULES.map(m => ({ id: m.id, x: 0, y: 0, vx: 0, vy: 0, fx: null, fy: null }));
const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));

// 初始布局：按分类扇形排布
(function initLayout() {
  const order = ['core','player','enemy','component','ui','scene'];
  const cx = 0, cy = 0, R = 210;
  order.forEach((cat, ci) => {
    const members = nodes.filter(n => byId[n.id].category === cat);
    const baseAngle = (ci / order.length) * Math.PI * 2 - Math.PI / 2;
    members.forEach((nd, mi) => {
      const spread = (mi - (members.length - 1) / 2) * 0.32;
      const a = baseAngle + spread;
      const rr = R + (mi % 2) * 40;
      nd.x = cx + Math.cos(a) * rr;
      nd.y = cy + Math.sin(a) * rr;
    });
  });
})();

let svgW = 0, svgH = 0, cx = 0, cy = 0, dragging = null;

function resize() {
  const r = svg.getBoundingClientRect();
  svgW = r.width; svgH = r.height;
  cx = svgW / 2; cy = svgH / 2;
  svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);
}
window.addEventListener('resize', resize);

function nodeW(m) { return Math.max(76, m.name.length * 9 + 30); }
const NODE_H = 40;

function buildSvg() {
  resize();
  // defs: 箭头
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = `
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-muted)"></path>
    </marker>
    <marker id="arrow-ext" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
    </marker>`;
  svg.appendChild(defs);

  // 边
  const edgeLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  edgeLayer.id = 'edges';
  EDGES.forEach(e => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('edge-group'); g.dataset.s = e.s; g.dataset.t = e.t;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.classList.add('edge', e.type);
    line.setAttribute('marker-end', e.type === 'extends' ? 'url(#arrow-ext)' : 'url(#arrow)');
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.classList.add('edge-label');
    lbl.textContent = e.label;
    g.appendChild(line); g.appendChild(lbl);
    edgeLayer.appendChild(g);
  });
  svg.appendChild(edgeLayer);

  // 节点
  const nodeLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  nodeLayer.id = 'nodes';
  nodes.forEach(n => {
    const m = byId[n.id];
    const w = nodeW(m);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('node', 'cat-' + m.category);
    g.dataset.id = n.id;
    g.setAttribute('transform', `translate(${n.x},${n.y})`);

    const body = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    body.setAttribute('x', -w/2); body.setAttribute('y', -NODE_H/2);
    body.setAttribute('width', w); body.setAttribute('height', NODE_H);
    body.setAttribute('rx', 9);
    body.setAttribute('fill', 'var(--surface-1)');
    body.setAttribute('stroke', 'var(--c)');
    g.appendChild(body);

    const name = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    name.classList.add('name');
    name.setAttribute('x', 0); name.setAttribute('y', -2);
    name.setAttribute('text-anchor', 'middle'); name.setAttribute('dominant-baseline', 'middle');
    name.textContent = m.name;
    g.appendChild(name);

    const kind = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    kind.classList.add('kind');
    kind.setAttribute('x', 0); kind.setAttribute('y', 13);
    kind.setAttribute('text-anchor', 'middle'); kind.setAttribute('dominant-baseline', 'middle');
    kind.textContent = m.base.split(' ')[0];
    g.appendChild(kind);

    const ring = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    ring.classList.add('ring');
    ring.setAttribute('x', -w/2 - 3); ring.setAttribute('y', -NODE_H/2 - 3);
    ring.setAttribute('width', w + 6); ring.setAttribute('height', NODE_H + 6);
    ring.setAttribute('rx', 11); ring.setAttribute('opacity', 0);
    g.appendChild(ring);

    g.addEventListener('click', () => selectModule(n.id));
    g.addEventListener('mousedown', (ev) => { dragging = n; ev.preventDefault(); });
    g.addEventListener('mouseenter', () => highlightNeighbors(n.id, true));
    g.addEventListener('mouseleave', () => highlightNeighbors(n.id, false));
    nodeLayer.appendChild(g);
  });
  svg.appendChild(nodeLayer);

  // 拖拽
  svg.addEventListener('mousemove', (ev) => {
    if (!dragging) return;
    const r = svg.getBoundingClientRect();
    const px = ev.clientX - r.left, py = ev.clientY - r.top;
    dragging.x = px; dragging.y = py;
    dragging.fx = px; dragging.fy = py;
    dragging.vx = 0; dragging.vy = 0;
  });
  window.addEventListener('mouseup', () => {
    if (dragging) { dragging.fx = null; dragging.fy = null; dragging = null; }
  });
}

function highlightNeighbors(id, on) {
  const neighbors = new Set([id]);
  EDGES.forEach(e => { if (e.s === id) neighbors.add(e.t); if (e.t === id) neighbors.add(e.s); });
  document.querySelectorAll('.node').forEach(g => {
    g.classList.toggle('dim', on && !neighbors.has(g.dataset.id));
  });
  document.querySelectorAll('.edge-group').forEach(g => {
    const rel = g.dataset.s === id || g.dataset.t === id;
    g.classList.toggle('dim', on && !rel);
    g.classList.toggle('hl', on && rel);
  });
}

function updateGraphSelection() {
  document.querySelectorAll('.node').forEach(g => {
    const sel = g.dataset.id === selectedModuleId;
    g.classList.toggle('selected', sel);
    g.querySelector('.ring').setAttribute('opacity', sel ? 1 : 0);
  });
  document.querySelectorAll('.edge-group').forEach(g => {
    const rel = g.dataset.s === selectedModuleId || g.dataset.t === selectedModuleId;
    g.classList.toggle('hl', !!selectedModuleId && rel);
    g.classList.toggle('dim', !!selectedModuleId && !rel);
  });
}

/* ---------- 力模拟 ---------- */
function tick() {
  const rep = 9000, springLen = 130, springK = 0.04, centerK = 0.012, damp = 0.82;
  // 斥力
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx*dx + dy*dy; if (d2 < 1) d2 = 1;
      const d = Math.sqrt(d2);
      const f = rep / d2;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
  }
  // 弹簧
  EDGES.forEach(e => {
    const a = nodeMap[e.s], b = nodeMap[e.t];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.max(0.1, Math.sqrt(dx*dx + dy*dy));
    const f = (d - springLen) * springK;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  });
  // 向心 + 边界
  nodes.forEach(n => {
    if (n.fx !== null) { n.x = n.fx; n.y = n.fy; n.vx = 0; n.vy = 0; return; }
    n.vx += (cx - n.x) * centerK;
    n.vy += (cy - n.y) * centerK;
    n.vx *= damp; n.vy *= damp;
    n.x += n.vx; n.y += n.vy;
    n.x = Math.max(60, Math.min(svgW - 60, n.x));
    n.y = Math.max(60, Math.min(svgH - 60, n.y));
  });
}

function draw() {
  // 边
  document.querySelectorAll('.edge-group').forEach(g => {
    const a = nodeMap[g.dataset.s], b = nodeMap[g.dataset.t];
    const line = g.querySelector('line');
    const lbl = g.querySelector('.edge-label');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    lbl.setAttribute('x', (a.x + b.x) / 2); lbl.setAttribute('y', (a.y + b.y) / 2 - 4);
    lbl.setAttribute('text-anchor', 'middle');
  });
  // 节点
  document.querySelectorAll('.node').forEach(g => {
    const n = nodeMap[g.dataset.id];
    g.setAttribute('transform', `translate(${n.x},${n.y})`);
  });
}

let running = true;
function loop() {
  if (running && !dragging) { for (let i = 0; i < 4; i++) tick(); }
  draw();
  requestAnimationFrame(loop);
}

/* ================= 启动 ================= */
buildSidebar();
buildLegend();
buildSvg();
resize();
selectModule('unit');
requestAnimationFrame(loop);

// 主题切换
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
});

// 侧边栏点击
document.querySelectorAll('.mod-item').forEach(item => {
  item.addEventListener('click', () => selectModule(item.dataset.id));
});

// 点击空白取消选中
svg.addEventListener('click', (ev) => {
  if (ev.target === svg) { selectedModuleId = null; updateGraphSelection(); }
});
</script>
</body>
</html>
